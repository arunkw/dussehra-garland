<style>
/* Layout: a doorway at dusk. The toran hangs from the top edge, the threshold is the floor, controls float just above it. */
:root {
  --dusk-top: #170f2b;
  --dusk-mid: #33163a;
  --dusk-low: #6b2a22;
  --threshold: #7a2e18;
  --threshold-hi: #b2532a;
  --chalk: #f3d9a4;
  --text: #f6e7cf;
  --muted: rgba(246, 231, 207, 0.66);
  --marigold: #f29a1d;
  --panel: rgba(26, 14, 34, 0.78);
  --paper: #fbf1d9;
  --ink: #3a1610;
  --font-ui: "Mukta", "Segoe UI", system-ui, sans-serif;
  --font-tag: "Tiro Devanagari Hindi", Georgia, "Nirmala UI", serif;
  --floor-h: 22px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background:
    radial-gradient(120% 70% at 50% 108%, var(--dusk-low) 0%, rgba(107, 42, 34, 0) 62%),
    linear-gradient(180deg, var(--dusk-top) 0%, var(--dusk-mid) 58%, #4a1d33 100%);
  background-color: var(--dusk-top);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; z-index: 1; }
#floor {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 0;
  height: calc(var(--floor-h) + env(safe-area-inset-bottom, 0px));
  background:
    radial-gradient(circle at 50% 55%, var(--chalk) 0 1.6px, transparent 2.2px) 0 0 / 18px 100% repeat-x,
    linear-gradient(180deg, var(--threshold-hi) 0 2px, var(--threshold) 2px 100%);
}
#safe-probe { position: fixed; bottom: 0; height: env(safe-area-inset-bottom, 0px); width: 0; visibility: hidden; }
#hint {
  position: fixed; left: 0; right: 0; top: 46%; z-index: 2; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; transition: opacity 0.8s ease;
}
#hint p { margin: 0 auto; max-width: 30ch; font-size: 1.05rem; line-height: 1.5; color: var(--muted); text-wrap: balance; }
#hint p strong { color: var(--chalk); font-weight: 600; }
#hint.gone { opacity: 0; }
#bar {
  position: fixed; left: 0; right: 0; z-index: 3;
  bottom: calc(var(--floor-h) + env(safe-area-inset-bottom, 0px) + 64px);
  display: flex; justify-content: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#bar .pill {
  pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
  padding: 5px; border-radius: 999px; background: var(--panel);
  border: 1px solid rgba(243, 217, 164, 0.18);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
button {
  font: 600 0.92rem/1 var(--font-ui); color: var(--text); background: transparent;
  border: 0; border-radius: 999px; padding: 10px 15px; cursor: pointer; letter-spacing: 0.01em;
}
button:hover { background: rgba(243, 217, 164, 0.12); }
button:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
button.primary { background: var(--marigold); color: #2a1206; }
button.primary:hover { background: #ffb13a; }
#credit {
  position: fixed; z-index: 3; right: 0; bottom: calc(var(--floor-h) + env(safe-area-inset-bottom, 0px) + 36px);
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 0.78rem; color: var(--muted);
}
#credit a { color: var(--chalk); text-decoration: none; border-bottom: 1px solid rgba(243, 217, 164, 0.35); }
#editor {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: rgba(10, 5, 16, 0.6);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#editor form {
  width: min(100%, 380px); background: var(--paper); color: var(--ink);
  border-radius: 6px; padding: 18px; display: grid; gap: 10px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}
#editor label { font: 600 0.95rem var(--font-ui); }
#editor small { color: #7a5a44; font-size: 0.8rem; }
#editor textarea {
  font: 1.05rem/1.4 var(--font-tag); color: var(--ink); background: #fffaf0;
  border: 1px solid #d9c09a; border-radius: 4px; padding: 10px; resize: none; height: 92px;
}
#editor textarea:focus-visible { outline: 2px solid var(--marigold); }
#editor .row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
#editor button { color: var(--ink); }
#editor button:hover { background: rgba(122, 46, 24, 0.1); }
#editor button.primary { color: #2a1206; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 11;
  bottom: calc(var(--floor-h) + env(safe-area-inset-bottom, 0px) + 122px);
  background: var(--paper); color: var(--ink); font: 600 0.9rem var(--font-ui);
  padding: 9px 16px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  max-width: calc(100% - 32px); text-align: center;
}
@media (prefers-reduced-motion: reduce) { #hint { transition: none; } }

<body>
<canvas id="stage" aria-label="Marigold garland. Move over it to sway the flowers, tap a flower to pluck it."></canvas>
<div id="floor" aria-hidden="true"></div>
<div id="safe-probe" aria-hidden="true"></div>
<div id="hint"><p><strong>Brush the garland</strong> to sway it. <strong>Tap a genda phool</strong> to pluck it and watch it fall. Double-tap the tag to write your own greeting.</p></div>
<div id="bar"><div class="pill">
  <button id="btn-edit" type="button">Edit tag</button>
  <button id="btn-share" type="button" class="primary">Share</button>
  <button id="btn-restring" type="button">Re-string</button>
  <button id="btn-install" type="button" hidden>Install app</button>
</div></div>
<div id="credit">Doneology Labs<span id="repo-link"></span></div>
<div id="editor" hidden>
  <form id="editor-form" autocomplete="off">
    <label for="tag-text">Text on the paper tag</label>
    <textarea id="tag-text" maxlength="90" spellcheck="false"></textarea>
    <small>First line becomes the heading. Hindi and Marathi work too.</small>
    <div class="row">
      <button type="button" id="btn-reset-text">Default</button>
      <button type="button" id="btn-cancel">Cancel</button>
      <button type="submit" class="primary" id="btn-save">Hang it</button>
    </div>
  </form>
</div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
const DEFAULT_TEXT = "Happy Dussehra\nfrom Doneology Labs";
const STAMPED_SITE = "__SITE_URL__";   // replaced by the GitHub Pages workflow
const STAMPED_REPO = "__REPO_URL__";

// ------------------------------------------------------------------ helpers
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rngFrom(seed) {               // mulberry32
  let t = seed >>> 0;
  const r = () => { t += 0x6D2B79F5; let x = t; x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  r.u = (a, b) => a + (b - a) * r();
  return r;
}
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, f) => c.map(v => clamp(v * f, 0, 255));
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ------------------------------------------------------------------ sprites
const ORANGE = { deep: [150, 45, 0], outer: [205, 72, 4], mid: [238, 110, 12], inner: [255, 148, 34] };
const YELLOW = { deep: [165, 100, 0], outer: [220, 148, 0], mid: [246, 188, 14], inner: [255, 216, 68] };
const mix3 = (p, t) => t < 0.5 ? mix(p.outer, p.mid, t * 2) : mix(p.mid, p.inner, (t - 0.5) * 2);

function newCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(w * DPR)); c.height = Math.max(1, Math.ceil(h * DPR));
  c.lw = w; c.lh = h;
  const x = c.getContext("2d"); x.scale(DPR, DPR);
  return [c, x];
}
function drawPetal(x, px, py, ang, pw, ph, col, rng) {
  x.save(); x.translate(px, py); x.rotate(ang);
  x.beginPath();
  x.moveTo(-pw * 0.35, ph * 0.4);
  x.bezierCurveTo(-pw * 0.62, ph * 0.1, -pw * 0.62, -ph * 0.5, -pw * 0.5, -ph * 0.72);
  for (let b = 0; b < 3; b++) {
    const x0 = -pw * 0.5 + pw * b / 3, x1 = -pw * 0.5 + pw * (b + 1) / 3;
    x.quadraticCurveTo((x0 + x1) / 2, -ph * (1.05 + rng.u(-0.12, 0.12)), x1, -ph * (0.72 + rng.u(-0.06, 0.06)));
  }
  x.bezierCurveTo(pw * 0.62, -ph * 0.5, pw * 0.62, ph * 0.1, pw * 0.35, ph * 0.4);
  x.closePath();
  const g = x.createLinearGradient(0, ph * 0.4, 0, -ph);
  g.addColorStop(0, rgb(shade(col, 1 / 1.4))); g.addColorStop(0.65, rgb(col)); g.addColorStop(1, rgb(shade(col, 1.14)));
  x.fillStyle = g; x.fill();
  x.lineWidth = 0.5; x.strokeStyle = rgb(shade(col, 1 / 1.55), 0.67); x.stroke();
  x.restore();
}
function makeMarigold(Rr, pal, seed) {
  const rng = rngFrom(seed), half = Rr * 1.12 + 2;
  const [c, x] = newCanvas(half * 2, half * 2);
  x.fillStyle = rgb(pal.deep); x.beginPath(); x.arc(half, half, Rr * 0.93, 0, 7); x.fill();
  const rings = 9;
  for (let k = 0; k < rings; k++) {
    const t = k / (rings - 1), rr = Rr * (0.72 - 0.66 * t), pw = Rr * (0.46 - 0.22 * t), ph = Rr * (0.34 - 0.14 * t);
    const n = Math.max(4, Math.floor(2 * Math.PI * Math.max(rr, Rr * 0.12) / (pw * 0.5)));
    const off = rng() * 6.283;
    for (let i = 0; i < n; i++) {
      const a = off + 6.283 * i / n + rng.u(-0.15, 0.15), r = Math.max(0, rr + rng.u(-0.05, 0.05) * Rr);
      const tc = clamp(t + rng.u(-0.15, 0.15), 0, 1);
      drawPetal(x, half + Math.cos(a) * r, half + Math.sin(a) * r, a + Math.PI / 2 + rng.u(-0.52, 0.52),
        pw * rng.u(0.85, 1.15), ph * rng.u(0.85, 1.15), mix3(pal, tc), rng);
    }
  }
  const g = x.createRadialGradient(half - Rr * 0.35, half - Rr * 0.42, 0, half - Rr * 0.35, half - Rr * 0.42, Rr * 1.55);
  g.addColorStop(0, "rgba(255,250,210,0.27)"); g.addColorStop(0.45, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(70,15,0,0.5)");
  x.globalCompositeOperation = "source-atop"; x.fillStyle = g; x.fillRect(0, 0, half * 2, half * 2);
  return { c, ox: half, oy: half };
}
function makeLeaf(L, Wd, seed) {
  const rng = rngFrom(seed), pad = 2, h = Wd + pad * 2;
  const [c, x] = newCanvas(L + pad * 2, h);
  x.translate(pad, h / 2);
  x.beginPath(); x.moveTo(0, 0);
  x.bezierCurveTo(L * 0.25, -Wd * 0.62, L * 0.68, -Wd * 0.52, L, 0);
  x.bezierCurveTo(L * 0.68, Wd * 0.52, L * 0.25, Wd * 0.62, 0, 0);
  const sh = rng.u(-12, 12), dark = [26 + sh / 2, 92 + sh, 34], light = [76 + sh / 2, 152 + sh, 58];
  const g = x.createLinearGradient(0, -Wd / 2, 0, Wd / 2);
  g.addColorStop(0, rgb(dark)); g.addColorStop(0.45, rgb(light)); g.addColorStop(1, rgb(shade(dark, 0.87)));
  x.fillStyle = g; x.fill(); x.lineWidth = 0.7; x.strokeStyle = "rgb(18,64,24)"; x.stroke();
  x.strokeStyle = "rgba(190,225,150,0.67)"; x.lineWidth = 0.8;
  x.beginPath(); x.moveTo(0, 0); x.lineTo(L * 0.93, 0); x.stroke();
  x.strokeStyle = "rgba(190,225,150,0.35)"; x.lineWidth = 0.5; x.beginPath();
  for (let i = 1; i < 7; i++) { const vx = L * i / 7.5;
    x.moveTo(vx, 0); x.lineTo(vx + L * 0.08, -Wd * 0.3); x.moveTo(vx, 0); x.lineTo(vx + L * 0.08, Wd * 0.3); }
  x.stroke();
  return { c, ox: pad, oy: h / 2 };
}
function makePetal(size, pal, seed) {
  const rng = rngFrom(seed);
  const [c, x] = newCanvas(size * 2, size * 2);
  drawPetal(x, size, size + size * 0.25, 0, size * 1.1, size * 0.9, mix3(pal, rng.u(0.2, 0.9)), rng);
  return { c, ox: size, oy: size };
}
function wrapLines(x, text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), out = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w;
    if (!cur || x.measureText(t).width <= maxW) cur = t; else { out.push(cur); cur = w; } }
  if (cur) out.push(cur);
  return out;
}
function makeTag(text, ts) {
  const TW = 172 * ts, TH = 106 * ts, holeY = 15 * ts, ch = 22 * ts, pad = 5 * ts;
  const [c, x] = newCanvas(TW + pad * 2, TH + pad * 2);
  x.translate(pad, pad);
  const shape = () => { x.beginPath(); x.moveTo(ch, 0); x.lineTo(TW - ch, 0); x.lineTo(TW, ch); x.lineTo(TW, TH); x.lineTo(0, TH); x.lineTo(0, ch); x.closePath(); };
  x.save(); x.translate(2.5 * ts, 3.5 * ts); shape(); x.fillStyle = "rgba(20,8,0,0.35)"; x.fill(); x.restore();
  shape();
  const g = x.createLinearGradient(0, 0, TW, TH); g.addColorStop(0, "#fdf6e2"); g.addColorStop(1, "#f0e0be");
  x.fillStyle = g; x.fill(); x.lineWidth = ts; x.strokeStyle = "#aa875a"; x.stroke();
  const rng = rngFrom(7);
  for (let i = 0; i < 140 * ts; i++) { x.fillStyle = `rgba(150,110,60,${rng.u(0.04, 0.11)})`;
    x.beginPath(); x.ellipse(rng.u(4, TW - 4), rng.u(ch / 2 + 4, TH - 4), rng.u(0.4, 1.1) * ts, rng.u(0.4, 1.1) * ts, 0, 0, 7); x.fill(); }
  const ins = 7 * ts;
  x.beginPath(); x.moveTo(ch + ins * 0.4, ins); x.lineTo(TW - ch - ins * 0.4, ins); x.lineTo(TW - ins, ch + ins * 0.4);
  x.lineTo(TW - ins, TH - ins); x.lineTo(ins, TH - ins); x.lineTo(ins, ch + ins * 0.4); x.closePath();
  x.setLineDash([4 * ts, 3 * ts]); x.strokeStyle = "rgba(140,30,25,0.6)"; x.stroke(); x.setLineDash([]);
  x.fillStyle = "#c4963c"; x.beginPath(); x.arc(TW / 2, holeY, 6.2 * ts, 0, 7); x.fill();
  x.fillStyle = "#f0cd78"; x.beginPath(); x.arc(TW / 2, holeY, 4.8 * ts, 0, 7); x.fill();
  x.globalCompositeOperation = "destination-out"; x.beginPath(); x.arc(TW / 2, holeY, 3.2 * ts, 0, 7); x.fill();
  x.globalCompositeOperation = "source-over";
  // text: first line is the heading, auto-fit into the box
  const lines = (text || "").split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) lines.push(" ");
  const bx = 14 * ts, by = holeY + 11 * ts, bw = TW - 28 * ts, bh = TH - holeY - 21 * ts;
  let plan = null;
  for (let size = 19; size >= 7; size -= 0.5) {
    const blocks = []; let total = 0;
    lines.forEach((ln, i) => {
      const px = size * ts * (i === 0 ? 1.12 : 0.86);
      const font = `${i === 0 ? "italic " : ""}${px}px "Tiro Devanagari Hindi", Georgia, "Nirmala UI", serif`;
      x.font = font; const wl = wrapLines(x, ln, bw); const lh = px * 1.22;
      blocks.push({ font, wl, lh, i }); total += wl.length * lh;
    });
    total += (lines.length - 1) * 2 * ts;
    plan = { blocks, total };
    if (total <= bh) break;
  }
  let y = by + Math.max(0, (bh - plan.total) / 2);
  x.textAlign = "center"; x.textBaseline = "top";
  for (const b of plan.blocks) {
    x.font = b.font; x.fillStyle = b.i === 0 ? "#801212" : "#5c2814";
    for (const w of b.wl) { x.fillText(w, bx + bw / 2, y + b.lh * 0.08); y += b.lh; }
    y += 2 * ts;
  }
  return { c, ox: pad + TW / 2, oy: pad + holeY, TW, TH, holeY };
}

// ------------------------------------------------------------------ world
const FO = 0, FY = 1, LEAF = 2, TASSEL = 3, BARE = 4, ANCHOR = 5, THREAD = 6, THOLE = 7, TBOT = 8;
const HSTEP = 1 / 120;
const canvas = document.getElementById("stage"), ctx = canvas.getContext("2d");
let DPR = 1, W = 0, H = 0, s = 1, R = 14, G = 1500, floorY = 0;
let N = 0, px, py, qx, qy, wt, kind, rot, sprI, nr, spin, spinv, theta0, origKind, th;
let cons = [], mins = [], chains = [], pins = [], tagHole = 0, tagBottom = 0;
let spr = {}, tag = null, bodies = [], tagText = DEFAULT_TEXT, simTime = 0;

function build() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  s = clamp(Math.min(W, 1920) / 1500, 0.78, 1.25);
  R = 14 * s; G = 1500 * s;
  updateFloor();
  spr.o = [0, 1, 2, 3, 4].map(i => makeMarigold(R * (0.94 + 0.03 * i), ORANGE, 100 + i));
  spr.y = [0, 1, 2, 3, 4].map(i => makeMarigold(R * (0.94 + 0.03 * i), YELLOW, 200 + i));
  spr.big = makeMarigold(R * 1.25, ORANGE, 999);
  spr.leaf = [0, 1, 2, 3, 4].map(i => makeLeaf(R * 2.5, R * 0.85, 300 + i));
  spr.petal = [0, 1, 2, 3].map(i => makePetal(R * 0.42, ORANGE, 400 + i)).concat([0, 1, 2, 3].map(i => makePetal(R * 0.42, YELLOW, 500 + i)));
  rebuildTag();
  buildGarland();
  bodies = [];
}
function updateFloor() {
  const safe = document.getElementById("safe-probe").getBoundingClientRect().height || 0;
  floorY = H - 22 - safe;
}
function rebuildTag() { tag = makeTag(tagText, clamp(s * 1.05, 0.88, 1.3)); }

function buildGarland() {
  const nodes = [];
  const add = (x, y, k, w = 1) => { nodes.push({ x, y, k, w, r: Math.random() * 6.283, sp: (Math.random() * 5) | 0 }); return nodes.length - 1; };
  cons = []; mins = []; chains = [];
  const spacing = R * 1.32, y0 = 12 * s;
  const fr = W < 700 ? [0.05, 0.5, 0.95] : [0.035, 0.355, 0.645, 0.965];
  pins = fr.map(f => add(f * W, y0, ANCHOR, 0));
  const mainPat = [FO, FO, FO, LEAF, FY, FY, FY, LEAF], mids = [];
  for (let k = 0; k < pins.length - 1; k++) {
    const a = pins[k], b = pins[k + 1], ax = nodes[a].x, span = nodes[b].x - ax;
    const n = Math.max(4, Math.round(span * 1.075 / spacing)), rest = span * 1.075 / n;
    const chain = [a];
    for (let i = 1; i < n; i++) chain.push(add(ax + span * i / n, y0, mainPat[(i - 1) % 8]));

        ctx.drawImage(sp.c, -sp.ox, -sp.oy, sp.c.lw, sp.c.lh);
      } else blit(sp, b.x, b.y, b.ang);
    } else if (b.k === "leaf") {
      const L = spr.leaf[b.sp], c = Math.cos(b.ang), sn = Math.sin(b.ang);
      ctx.setTransform(c * DPR, sn * DPR, -sn * DPR, c * DPR, b.x * DPR, b.y * DPR);
      ctx.drawImage(L.c, -L.c.lw / 2, -L.oy, L.c.lw, L.c.lh);
    } else blit(spr.petal[b.sp], b.x, b.y, b.ang);
  }
  ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ------------------------------------------------------------------ UI: hint, editor, share, install
const $ = id => document.getElementById(id);
let hintTimer = setTimeout(hideHint, 9000);
function hideHint() { clearTimeout(hintTimer); $("hint").classList.add("gone"); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => { t.hidden = true; }, 2600); }

function openEditor() { $("tag-text").value = tagText; $("editor").hidden = false; setTimeout(() => $("tag-text").focus(), 30); }
function closeEditor() { $("editor").hidden = true; }
function setTagText(t) {
  tagText = (t || "").replace(/\r/g, "").split("\n").slice(0, 4).join("\n").trim() || DEFAULT_TEXT;
  ls.set("tagText", tagText); rebuildTag(); px[tagBottom] += 3 * s; wake();
}
$("btn-edit").addEventListener("click", openEditor);
$("btn-cancel").addEventListener("click", closeEditor);
$("btn-reset-text").addEventListener("click", () => { $("tag-text").value = DEFAULT_TEXT; });
$("editor-form").addEventListener("submit", e => { e.preventDefault(); setTagText($("tag-text").value); closeEditor(); toast("Tag updated"); });
$("editor").addEventListener("pointerdown", e => { if (e.target.id === "editor") closeEditor(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("editor").hidden) closeEditor(); });
$("btn-restring").addEventListener("click", () => { restring(); toast("Garland re-strung"); });

const onPages = !STAMPED_SITE.startsWith("__");
const siteUrl = onPages ? STAMPED_SITE : (location.origin + location.pathname);
if (!STAMPED_REPO.startsWith("__")) $("repo-link").innerHTML = ` · <a href="${STAMPED_REPO}" target="_blank" rel="noopener">Source on GitHub</a>`;
function shareLink() {
  return tagText === DEFAULT_TEXT ? siteUrl : siteUrl + "?t=" + encodeURIComponent(tagText);
}
$("btn-share").addEventListener("click", async () => {
  const url = shareLink();
  const text = "A marigold garland for your screen. Pluck a genda phool and watch it fall. Happy Dussehra!";
  if (navigator.share) { try { await navigator.share({ title: "Dussehra Garland", text, url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); toast("Link copied. Paste it anywhere."); }
  catch (e) { toast(url); }
});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("btn-install").hidden = false; });
$("btn-install").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $("btn-install").hidden = true; });
if ("serviceWorker" in navigator && onPages && window.top === window) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

// ------------------------------------------------------------------ boot
try { const q = new URLSearchParams(location.search).get("t"); tagText = (q && q.trim()) || ls.get("tagText") || DEFAULT_TEXT; } catch (e) {}
build();
wake();
let lastW = W;
window.addEventListener("resize", () => {
  const nw = window.innerWidth, nh = window.innerHeight;
  if (Math.abs(nw - lastW) > 40) { lastW = nw; build(); }
  else { W = nw; H = nh; canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR); updateFloor(); }
  wake();
});
if (document.fonts && document.fonts.load) document.fonts.load('20px "Tiro Devanagari Hindi"').then(() => { rebuildTag(); wake(); }).catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
// test hooks
window.__garland = { tapAt, pluck, get N() { return N; }, get kind() { return kind; }, get px() { return px; }, get py() { return py; }, get bodies() { return bodies; }, pointer, wake };
})();
</script>
