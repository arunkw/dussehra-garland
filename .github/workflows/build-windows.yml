name: Build Windows app

# Builds DussehraGarland.exe from the source in /desktop on GitHub's own Windows machine,
# so anyone can see exactly what went into the download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pillow pyinstaller
      - name: Generate the icon if it is not in the repository yet
        shell: pwsh
        run: |
          if (-not (Test-Path desktop/garland.ico)) { $env:QT_QPA_PLATFORM = "offscreen"; python tools/make_assets.py --ico-only }
      - name: Build the .exe
        working-directory: desktop
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name DussehraGarland --icon garland.ico --exclude-module tkinter dussehra_garland.py
      - name: SHA-256 checksum
        working-directory: desktop/dist
        shell: pwsh
        run: (Get-FileHash DussehraGarland.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii DussehraGarland.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DussehraGarland-windows
          path: desktop/dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/DussehraGarland.exe
            desktop/dist/DussehraGarland.exe.sha256
